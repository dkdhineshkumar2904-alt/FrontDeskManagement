services:
  freshdesk-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: freshdesk-mcp-connector
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - FRESHDESK_DOMAIN=${FRESHDESK_DOMAIN:-acme}
      - FRESHDESK_API_KEY=${FRESHDESK_API_KEY:-your_api_key_here}
      - FRESHDESK_TIMEOUT=${FRESHDESK_TIMEOUT:-15.0}
      - FRESHDESK_MAX_RETRIES=${FRESHDESK_MAX_RETRIES:-3}
      - FRESHDESK_MAX_PAGES=${FRESHDESK_MAX_PAGES:-5}
      - FRESHDESK_CONCURRENCY_LIMIT=${FRESHDESK_CONCURRENCY_LIMIT:-5}
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/mcp"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
